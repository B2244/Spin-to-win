<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin & Win - Telegram WebApp</title>
    <!-- የቴሌግራም ኦፊሴላዊ ጃቫስክሪፕት ላይብረሪ -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: var(--tg-theme-button-color, #2481cc);
            text-align: center;
        }
        p {
            margin-top: 0;
            margin-bottom: 25px;
            color: var(--tg-theme-hint-color, #708499);
            text-align: center;
        }
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 30px;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid var(--tg-theme-button-text-color, #fff);
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            background: conic-gradient(
                #e74c3c 0deg 60deg,
                #f1c40f 60deg 120deg,
                #2ecc71 120deg 180deg,
                #3498db 180deg 240deg,
                #9b59b6 240deg 300deg,
                #e67e22 300deg 360deg
            );
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.1, 1);
        }
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid var(--tg-theme-button-color, #2481cc);
            z-index: 10;
        }
        .spin-btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px 40px;
            font-size: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            max-width: 280px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: 0.2s;
        }
        .spin-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .spin-btn:disabled {
            background-color: var(--tg-theme-hint-color, #708499);
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <h1 id="user-greeting">ሰላም! 🎰</h1>
    <p>መንኮራኩሩን ያሽከርክሩና የቴሌብር ሽልማት ያሸንፉ!</p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spinWheel()">አሽከርክር (Spin)</button>

    <script>
        // ቴሌግራም ዌብአፕን ማስጀመር
        const tg = window.Telegram.WebApp;
        tg.expand(); // ዌብአፑ በሙሉ ስክሪን እንዲከፈት ማድረግ

        // የተጠቃሚውን ስም ከቴሌግራም ወስዶ ሰላምታ መስጠት
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-greeting').textContent = `ሰላም ${tg.initDataUnsafe.user.first_name}! 🎰`;
        }

        let isSpinning = false;
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');

        // በየክፍሉ ያሉ የሽልማት መጠኖች (ETB)
        const prizes =; 

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;

            // የዘፈቀደ ዲግሪ ማመንጨት (ቢያንስ 5 ዙር እንዲዞር)
            const randomDegrees = Math.floor(Math.random() * 360) + 1800; 
            wheel.style.transform = `rotate(${randomDegrees}deg)`;

            // መንኮራኩሩ ዞሮ ሲያበቃ (ከ 4 ሰከንድ በኋላ)
            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;

                // የትኛው ክፍል ላይ እንደቆመ ማስላት
                const actualDegrees = randomDegrees % 360;
                const prizeIndex = Math.floor((360 - actualDegrees) / 60) % 6;
                const wonAmount = prizes[prizeIndex];

                // ውጤቱን ወደ ቴሌግራም ቦት (Python Backend) መላክ
                if (tg) {
                    tg.sendData(JSON.stringify({
                        action: "spin_result",
                        amount: wonAmount
                    }));
                }
                
            }, 4000);
        }
    </script>
</body>
</html>
